<style>
:root{--bg:#f6f8fb;--card:#fff;--text:#23334a;--muted:#56647a;--line:#d4deeb;--blue:#155eb2;--tint:#eaf3ff;--green:#246541;--greenbg:#eaf5ed;--orange:#805315;--orangebg:#fff4df;--red:#a63229;--redbg:#fcece9;--shadow:0 4px 16px #243b5b08}
@media(prefers-color-scheme:dark){:root{--bg:#171e28;--card:#202b39;--text:#f3f6fb;--muted:#bac6d7;--line:#4b5c73;--blue:#8bbcff;--tint:#263b58;--green:#a0daba;--greenbg:#243d32;--orange:#f1ce97;--orangebg:#403627;--red:#f8b0a9;--redbg:#492d2b;--shadow:none}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:default}button,a,input,textarea,summary{outline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--blue)}button{min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:10px 16px;font-weight:650}button:not(:disabled):hover{border-color:var(--blue);background:var(--tint)}button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}@media(prefers-color-scheme:dark){button.primary{color:#132640}}button.primary:not(:disabled):hover{filter:brightness(.94)}button:disabled{opacity:.55}h1,h2,h3,p{margin:0}h1{font-size:clamp(28px,4vw,42px);line-height:1.15;letter-spacing:-1px}h2{font-size:26px;line-height:1.25;letter-spacing:-.4px}h3{font-size:19px;line-height:1.35}.muted{color:var(--muted)}.small{font-size:14px}.eyebrow{font-size:13px;font-weight:750;text-transform:uppercase;letter-spacing:1.2px;color:var(--blue)}.stack>*+*{margin-top:16px}.tight>*+*{margin-top:8px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}.wrap{max-width:1120px;margin:auto;padding:24px 32px 40px}.top{border-bottom:1px solid var(--line);background:var(--card)}.top .wrap{padding-top:16px;padding-bottom:16px}.brand{font-size:16px;font-weight:800}.badge{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-size:13px;font-weight:650}.dot{width:7px;height:7px;border-radius:50%;background:var(--green)}.card{border:1px solid var(--line);border-radius:12px;padding:24px;background:var(--card);box-shadow:var(--shadow)}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:start}.hero-copy{padding:16px 0}.hero-copy p{max-width:650px}.story{background:var(--tint);padding:24px;border:1px solid var(--line);border-radius:12px}.identity{display:flex;gap:12px;align-items:center}.avatar{width:48px;height:48px;display:grid;place-items:center;background:var(--blue);color:white;font-weight:800;border-radius:10px;flex-shrink:0}@media(prefers-color-scheme:dark){.avatar{color:#132640}}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.mission-card{padding:20px}.number{color:var(--blue);font-size:28px;font-weight:800;line-height:1.2}.mission-card h3{margin-top:12px}.mission-card p{margin-top:8px;font-size:14px}.actions{margin-top:24px}.note{border-left:3px solid var(--blue);padding:12px 16px;background:var(--tint);border-radius:0 8px 8px 0}.warn{background:var(--orangebg);color:var(--orange);border-left-color:var(--orange)}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0;padding:0;list-style:none}.steps li{padding:10px 12px;font-size:14px;border:1px solid var(--line);border-radius:8px;background:var(--card)}.steps li.current{border-color:var(--blue);background:var(--tint);font-weight:750}.steps li.done{color:var(--green);background:var(--greenbg)}.progress{height:6px;border-radius:6px;overflow:hidden;background:var(--line);margin:16px 0 24px}.progress span{height:100%;display:block;background:var(--blue)}.gamegrid{display:grid;grid-template-columns:.95fr 1.05fr;gap:24px;margin-top:24px}.evidence{padding:0;overflow:hidden}.evidence-bar{padding:12px 20px;border-bottom:1px solid var(--line);font-size:12px;font-weight:800;letter-spacing:1px;background:var(--tint);color:var(--blue)}.evidence-content{padding:24px}.quoted{font-size:20px;line-height:1.5;padding:20px 0;white-space:pre-line}.evidence-foot{border-top:1px solid var(--line);padding:12px 20px;font-size:14px;color:var(--muted)}.choice{width:100%;text-align:left;display:flex;gap:12px;align-items:flex-start;font-weight:500;padding:14px;margin-top:12px;line-height:1.45}.letter{display:grid;place-items:center;flex:0 0 28px;min-height:28px;background:var(--tint);color:var(--blue);font-weight:800;border-radius:5px}.choice.selected{border:2px solid var(--blue);padding:13px}.choice.correct{border-color:var(--green);background:var(--greenbg)}.choice.wrong{border-color:var(--red);background:var(--redbg)}.choice:disabled{opacity:1}.feedback{margin-top:16px;padding:16px;border-radius:8px;border:1px solid var(--line);background:var(--tint)}.feedback.good{background:var(--greenbg);border-color:var(--green)}.feedback.review{background:var(--orangebg);border-color:var(--orange)}.feedback p{margin-top:8px}.hint{margin-top:16px;padding:12px 16px;border:1px solid var(--line);border-radius:8px;font-size:14px}summary{cursor:pointer;font-weight:700;min-height:28px}.hint p{margin-top:8px}.instruction{padding:24px;margin-top:24px}.reflection{max-width:780px;margin:32px auto}.reflection textarea,.extra textarea{width:100%;min-height:140px;resize:vertical;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;padding:16px;margin-top:12px}.results{display:grid;grid-template-columns:.7fr 1.3fr;gap:24px;margin-top:24px}.score{font-size:52px;font-weight:800;line-height:1.15;color:var(--blue);letter-spacing:-2px}.answers{display:grid;gap:16px}.entry{padding-bottom:16px;border-bottom:1px solid var(--line)}.entry:last-child{border-bottom:0;padding:0}.entry p{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:8px}.bonusgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.extra{padding:20px}.extra textarea{min-height:110px}.guide{margin-top:24px}.guide summary{min-height:44px;display:flex;align-items:center}.guide summary:before{content:'+';font-size:24px;margin-right:12px;color:var(--blue)}.guide[open] summary:before{content:'−'}.guide-body{margin-top:16px}.guide-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.schedule{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}.schedule th,.schedule td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}.schedule th:first-child{width:80px}.guide ol,.guide ul{padding-left:24px}footer{font-size:13px;color:var(--muted);margin-top:24px}.screen-title:focus{outline:none}.save-status{font-size:13px;color:var(--muted)}.checkpoint{display:flex;gap:12px;align-items:flex-start;background:var(--tint);padding:16px;border-radius:8px;margin-top:16px}.checkmark{color:var(--green);font-size:24px;font-weight:800}.error{color:var(--red);font-size:14px}.divider{height:1px;background:var(--line);margin:24px 0}.print-only{display:none}dialog{max-width:500px;width:calc(100% - 32px);border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);padding:24px}dialog::backdrop{background:#10243c77}#printReport{display:none}
@media(max-width:800px){.wrap{padding:24px}.hero,.gamegrid,.results,.guide-grid{grid-template-columns:1fr}.grid4{grid-template-columns:1fr 1fr}.steps li{font-size:12px;padding:8px}.gamegrid{gap:16px}.quoted{font-size:18px}.bonusgrid{grid-template-columns:1fr}.hero-copy{padding:0}.top .wrap{padding:12px 24px}.top .row{gap:8px}}
@media(max-width:440px){.wrap{padding:20px 16px}.top .wrap{padding:12px 16px}.grid4{gap:8px}.mission-card{padding:16px}.mission-card h3{font-size:17px}.card{padding:20px}.evidence{padding:0}.evidence-content{padding:20px}.steps{grid-template-columns:1fr 1fr}h2{font-size:24px}.header-controls button{padding:8px 10px;font-size:14px}.score{font-size:44px}.quoted{padding:16px 0}.brand{font-size:14px}}
@media print{body{background:white;color:black;font-size:11pt}.top,main,footer,dialog{display:none!important}#printReport{display:block}#printReport h1{font-size:22pt}#printReport h2{font-size:14pt;margin-top:20px}#printReport p{white-space:pre-wrap;margin:8px 0}#printReport{padding:20px}.print-section{break-inside:avoid}}
</style>

<body>
<header class="top"><div class="wrap row between"><div class="row"><span class="brand">DETETIVES DA PRIVACIDADE</span><span class="badge"><span class="dot"></span>100% offline</span></div><div class="row header-controls"><span id="timeLabel" class="small muted" aria-label="Tempo da equipe">00:00</span><button id="pauseBtn" hidden onclick="togglePause()">Pausar tempo</button><button onclick="openGuide()">Roteiro da aula</button><button onclick="askReset()" aria-label="Reiniciar o jogo">Reiniciar</button></div></div></header>
<main id="main" class="wrap"></main>
<dialog id="resetDialog" aria-labelledby="resetTitle"><div class="stack"><h2 id="resetTitle">Começar uma nova investigação?</h2><p>As escolhas e anotações desta equipe serão apagadas neste aparelho. Baixem o resumo antes, se quiserem guardar o trabalho.</p><div class="row"><button onclick="document.getElementById('resetDialog').close()">Cancelar</button><button class="primary" onclick="resetGame()">Apagar e reiniciar</button></div></div></dialog>
<div id="printReport"></div>
<script>
'use strict';
const DATA={"missions": [{"title": "O perfil exposto", "subtitle": "Investigue o que Alex deixa aparecer.", "intro": "Alex percebeu que pessoas desconhecidas sabem detalhes da sua rotina. Vocês vão examinar seis partes do perfil. Nem tudo é um problema: investiguem antes de decidir.", "role": "O leitor apresenta a pista; o investigador explica o risco; quem controla registra a decisão.", "reflect": "Escolham duas informações que, juntas, poderiam revelar mais sobre Alex do que ele pretendia. Expliquem como.", "items": [{"type": "PUBLICAÇÃO · PERFIL ABERTO", "title": "Toda terça, no mesmo lugar", "text": "“Saio da Escola Horizonte às 12h e espero sozinho no portão azul até 12h30.”", "q": "Qual é a melhor decisão para esta publicação?", "options": ["Manter: não aparece o endereço completo.", "Revisar: ela revela lugar, horário e uma situação de vulnerabilidade.", "Acrescentar o número de telefone para facilitar o contato."], "correct": 1, "explain": "A combinação de escola, horário e rotina revela onde encontrar Alex. É melhor não publicar esses detalhes, especialmente num perfil aberto. Não aparecer o endereço completo não elimina o risco.", "clue": "Uma informação pequena pode ganhar importância quando se junta a outras."}, {"type": "DESCRIÇÃO · PERFIL ABERTO", "title": "Contato para qualquer pessoa", "text": "“Meu telefone pessoal é [número fictício]. Pode me chamar a qualquer hora!”", "q": "Como proteger esse contato?", "options": ["Retirar o telefone do perfil público e compartilhar apenas quando necessário, com pessoas de confiança.", "Deixar o número porque ele não é uma senha.", "Trocar apenas o último dígito e manter o resto público."], "correct": 0, "explain": "Telefone também é dado pessoal. Expor o contato pode facilitar abordagens indesejadas e golpes. Dados pessoais não são apenas senhas.", "clue": "Quem pode ver o perfil? Quem realmente precisa desse dado?"}, {"type": "PUBLICAÇÃO · PERFIL ABERTO", "title": "Desenho do dia", "text": "Alex publica um desenho de um robô, feito por ele. A imagem não mostra pessoas, documentos, localização ou outros dados pessoais.", "q": "O que a equipe conclui?", "options": ["Todo desenho revela automaticamente a localização.", "É obrigatório apagar qualquer publicação.", "Este exemplo expõe menos informações pessoais; ainda vale revisar o público e o conteúdo antes de postar."], "correct": 2, "explain": "Não é preciso tratar toda publicação como perigosa. Neste exemplo, o conteúdo não apresenta os dados citados. Mesmo assim, revisar a imagem e quem poderá vê-la é um bom hábito.", "clue": "Identifiquem um risco concreto. Não inventem um risco que não está na pista."}, {"type": "FOTO · DESCRIÇÃO DA IMAGEM", "title": "A foto tem um detalhe", "text": "Alex fotografa o gato na sala. Ao fundo, um envelope deixa visíveis o nome completo e o endereço da família.", "q": "O que Alex deveria fazer antes de publicar?", "options": ["Publicar: o gato é o assunto principal.", "Recortar ou cobrir os dados de modo que não possam ser lidos e conferir a imagem inteira.", "Escrever o endereço também na legenda."], "correct": 1, "explain": "O fundo da imagem também comunica informações. Alex pode refazer a foto ou ocultar de forma efetiva os dados, verificando o resultado antes de publicar.", "clue": "Olhem além do assunto principal da foto."}, {"type": "STATUS · PERFIL ABERTO", "title": "Casa vazia", "text": "“Viajamos hoje! A casa vai ficar vazia até domingo.”", "q": "Qual orientação faz mais sentido?", "options": ["Evitar divulgar publicamente a ausência e conversar com a família sobre o que compartilhar.", "Adicionar uma foto da fachada da casa.", "Publicar mais horários para que ninguém fique em dúvida."], "correct": 0, "explain": "Informar que a casa está vazia pode expor a família. A equipe não precisa proibir toda foto de viagem: o ponto é evitar detalhes que revelem ausência, endereço e rotina.", "clue": "A postagem fala só de Alex ou também expõe outras pessoas?"}, {"type": "LOCALIZAÇÃO · CONFIGURAÇÃO", "title": "Quem consegue acompanhar?", "text": "Um aplicativo oferece compartilhar a localização de Alex em tempo real. A tela não deixa claro se o acesso será público ou restrito.", "q": "O que fazer antes de ativar?", "options": ["Ativar e conferir depois.", "Dar acesso a qualquer pessoa que pedir.", "Verificar quem terá acesso, por quanto tempo e se o recurso é necessário, com ajuda de um responsável."], "correct": 2, "explain": "Compartilhamento de localização pode ser útil em situações específicas, mas exige cuidado com finalidade, público e duração. Como a configuração é incerta, é preciso verificar antes.", "clue": "Quando falta uma informação essencial, a resposta pode ser verificar."}]}, {"title": "O aplicativo curioso", "subtitle": "Uma permissão precisa ter motivo.", "intro": "Alex quer instalar alguns aplicativos. Para cada pedido, decidam se ele faz sentido, se deve ser recusado ou se falta verificar algo. Não existe uma lista de permissões sempre boas ou sempre ruins.", "role": "Troquem quem controla o Chromebook. Uma pessoa lê a função do app, outra analisa a permissão.", "reflect": "Escolham um pedido de permissão. Expliquem como a função do aplicativo ajuda a decidir se o pedido faz sentido.", "items": [{"type": "APP FICTÍCIO · LANTERNA", "title": "Luz que quer seus contatos", "text": "Função anunciada: acender a lanterna. Pedido: acesso à lista de contatos.", "q": "Qual decisão protege melhor Alex?", "options": ["Permitir, porque todo aplicativo precisa dos contatos.", "Negar esse acesso; ele não é necessário para a função anunciada. Se o app insistir, não continuar e pedir ajuda.", "Enviar também a senha da conta."], "correct": 1, "explain": "Acesso aos contatos não se justifica pela função de lanterna. Isso não prova, sozinho, que o app tem malware, mas é um motivo para recusar e verificar o aplicativo.", "clue": "Compare a função anunciada com o dado solicitado."}, {"type": "APP FICTÍCIO · GRAVADOR", "title": "Microfone durante a gravação", "text": "Alex abriu um gravador de áudio cuja origem foi conferida com um responsável. Ele quer gravar uma narração e o app pede acesso ao microfone durante o uso.", "q": "O pedido faz sentido neste contexto?", "options": ["Sim: o microfone é necessário para gravar; permitir apenas quando necessário e não gravar outras pessoas sem autorização.", "Não: microfone nunca deve ser usado.", "Sim: permitir também contatos e localização, mesmo sem motivo."], "correct": 0, "explain": "Uma permissão pode ser adequada à função. Aqui, o microfone tem uma finalidade clara. Ainda assim, é importante limitar o acesso e respeitar a privacidade de outras pessoas.", "clue": "O aplicativo consegue realizar esta tarefa sem a permissão?"}, {"type": "APP FICTÍCIO · ADESIVOS", "title": "Localização o tempo todo", "text": "Um aplicativo para criar adesivos pede acesso à localização mesmo quando está fechado. Não explica para que precisa disso.", "q": "Qual é a melhor atitude?", "options": ["Aceitar qualquer permissão para terminar mais rápido.", "Permitir porque a localização não é dado pessoal.", "Negar e verificar o motivo; não há uma necessidade clara no cenário."], "correct": 2, "explain": "Localização é informação pessoal e pode revelar rotina. Um pedido contínuo sem finalidade clara deve ser questionado. Se não houver uma explicação adequada, é melhor não conceder.", "clue": "“O tempo todo” é diferente de “só enquanto uso”."}, {"type": "APP FICTÍCIO · FOTOS", "title": "Uma imagem ou a galeria inteira?", "text": "Um editor de fotos, cuja origem foi conferida, permite escolher apenas a imagem a editar ou liberar a galeria inteira. Alex precisa editar só um desenho.", "q": "Qual opção reduz o acesso desnecessário?", "options": ["Liberar a galeria inteira para garantir.", "Selecionar apenas a imagem necessária, se o dispositivo oferecer essa opção.", "Publicar toda a galeria primeiro."], "correct": 1, "explain": "Dar acesso apenas ao necessário reduz a exposição. As opções variam por dispositivo e app, mas o princípio é o mesmo: não conceder mais acesso do que a tarefa exige.", "clue": "Qual é o menor acesso suficiente para esta tarefa?"}, {"type": "APP FICTÍCIO · MAPA", "title": "Um mapa antes de sair", "text": "Um app de mapas pede localização para indicar uma rota. Alex não sabe de onde o app veio, nem quais opções de acesso existem.", "q": "O que falta fazer?", "options": ["Verificar a origem e as opções com um responsável; a função pode justificar a localização, mas não qualquer acesso.", "Conceder acesso permanente porque todo mapa é confiável.", "Concluir que qualquer mapa é um vírus."], "correct": 0, "explain": "A localização pode ser útil para uma rota. Mas a finalidade não substitui a verificação da origem e das configurações. Também é possível conferir alternativas, como digitar um local quando apropriado.", "clue": "Um pedido fazer sentido não significa que o aplicativo já foi verificado."}]}, {"title": "Pode publicar?", "subtitle": "Uma postagem também envolve outras pessoas.", "intro": "Alex quer compartilhar novidades. Antes de publicar, a equipe vai cuidar da privacidade, do respeito e de quem poderá guardar ou repassar o conteúdo.", "role": "Troquem novamente quem controla. Antes de marcar, cada colega deve dizer o que faria.", "reflect": "Por que apagar uma publicação pode não resolver tudo? Deem um exemplo fictício e uma atitude de prevenção.", "items": [{"type": "FOTO · COLEGA", "title": "A foto engraçada", "text": "Alex tirou uma foto de um colega fazendo uma careta. O colega ainda não viu a foto nem autorizou a publicação.", "q": "Qual é a melhor atitude?", "options": ["Publicar, porque foi tirada durante a aula.", "Publicar sem marcar o nome: isso sempre resolve.", "Perguntar antes e respeitar a resposta; não publicar se a pessoa não concordar."], "correct": 2, "explain": "Uma foto pode identificar alguém mesmo sem seu nome. Pedir autorização e respeitar a decisão é uma atitude de cuidado. Não postar costuma ser a melhor escolha quando há dúvida ou constrangimento.", "clue": "A foto envolve a vontade de quem aparece nela?"}, {"type": "INGRESSO · CÓDIGO VISÍVEL", "title": "Meu passeio chegou!", "text": "Alex quer mostrar um ingresso. A imagem exibe um código de acesso e dados da compra.", "q": "Como mostrar a novidade com mais cuidado?", "options": ["Mostrar o ingresso inteiro para provar que é verdadeiro.", "Não publicar os códigos nem os dados; usar uma imagem que não exponha essas informações.", "Enviar o código a desconhecidos nos comentários."], "correct": 1, "explain": "Códigos podem permitir acesso a serviços ou informações. É possível compartilhar a novidade sem expor o ingresso, os dados e os códigos.", "clue": "Um código pode funcionar como uma chave."}, {"type": "PRINT · CONVERSA PRIVADA", "title": "Era só uma conversa", "text": "Um amigo contou um problema pessoal numa conversa privada. Alex pensa em postar um print num grupo.", "q": "O que a equipe orienta?", "options": ["Não divulgar. Se houver risco à segurança, procurar um adulto de confiança, sem espalhar o conteúdo.", "Publicar, porque é um grupo de colegas.", "Publicar e apagar depois de cinco minutos."], "correct": 0, "explain": "Uma conversa privada não vira pública só porque temos um print. Quando alguém precisa de proteção ou ajuda, o caminho é buscar apoio adequado, não expor a pessoa para o grupo.", "clue": "Pedir ajuda é diferente de espalhar uma conversa."}, {"type": "POSTAGEM · APAGADA", "title": "Apaguei, então sumiu?", "text": "Alex publicou algo de que se arrependeu e apagou. Uma pessoa diz que já tinha feito um print.", "q": "O que podemos concluir?", "options": ["Apagar elimina todas as cópias de qualquer lugar.", "Agora é impossível pedir ajuda.", "Apagar pode reduzir a exposição, mas cópias podem continuar; Alex pode buscar ajuda e usar os recursos de denúncia quando necessário."], "correct": 2, "explain": "Apagar não garante que ninguém tenha copiado o conteúdo. Isso não significa que nada possa ser feito: buscar apoio, remover o que for possível e denunciar situações inadequadas pode ajudar.", "clue": "O que acontece quando outra pessoa já guardou uma cópia?"}, {"type": "GRUPO · NOVO PARTICIPANTE", "title": "“É só entre amigos”", "text": "Alex compartilha informações pessoais em um grupo. Depois, alguém adiciona uma pessoa que ele não conhece.", "q": "Como pensar sobre esse compartilhamento?", "options": ["Grupo privado garante que ninguém copie nada.", "Rever o que compartilhar e as regras do grupo; integrantes podem mudar e conteúdos podem ser encaminhados.", "Publicar mais dados para se apresentar."], "correct": 1, "explain": "Um grupo restrito pode diminuir o público, mas não impede prints ou encaminhamentos. Compartilhar pouco e combinar regras são cuidados úteis, sem tratar toda conversa como proibida.", "clue": "Um público restrito significa controle total sobre o conteúdo?"}, {"type": "COMENTÁRIO · HUMOR", "title": "A brincadeira passou do limite", "text": "Um colega pede para Alex parar de postar piadas sobre ele. Alex diz que era “só brincadeira”.", "q": "Qual atitude ajuda a resolver?", "options": ["Parar, ouvir o colega, retirar o conteúdo quando possível e reparar o que fez; procurar ajuda se necessário.", "Continuar, porque a intenção era brincar.", "Pedir ao grupo para compartilhar mais."], "correct": 0, "explain": "O efeito da postagem também importa. Quando alguém se sente exposto ou desrespeitado, é importante escutar e interromper a situação. Cuidar da privacidade inclui respeito.", "clue": "Quem decide sozinho se uma postagem constrange outra pessoa?"}]}, {"title": "A conta protegida", "subtitle": "Fechem o caso com um plano de proteção.", "intro": "A investigação está quase completa. Agora a equipe vai ajudar Alex a proteger a conta e a agir com calma quando algo estranho acontece. Todas as situações são fictícias: nunca digitem suas senhas aqui.", "role": "A última pessoa assume o controle. A decisão deve ser discutida por toda a equi const KEY='detetives-privacidade-v1';
const TOTAL=DATA.missions.reduce((n,m)=>n+m.items.length,0);
const blank=()=>({version:1,screen:'home',m:0,q:0,answers:{},notes:['','','',''],bonus:['','','',''],elapsed:0,started:false,paused:false});
let S=blank(),storageOK=true,tickAt=Date.now();
const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
try{const loaded=JSON.parse(localStorage.getItem(KEY)||'null');if(loaded&&loaded.version===1&&['home','brief','question','reflection','results','bonus'].includes(loaded.screen)&&Number.isInteger(loaded.m)&&loaded.m>=0&&loaded.m<4&&Number.isInteger(loaded.q)&&loaded.q>=0&&loaded.q<DATA.missions[loaded.m].items.length&&loaded.answers&&Array.isArray(loaded.notes)&&loaded.notes.length===4&&Array.isArray(loaded.bonus)&&loaded.bonus.length===4&&typeof loaded.elapsed==='number')S=loaded;}catch(e){storageOK=false;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){storageOK=false;}}
function timeText(){const sec=Math.floor(S.elapsed/1000);return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');}
function syncTimer(){const now=Date.now();if(S.started&&!S.paused)S.elapsed+=Math.min(now-tickAt,60000);tickAt=now;$('#timeLabel').textContent=timeText();$('#pauseBtn').hidden=!S.started;$('#pauseBtn').textContent=S.paused?'Retomar tempo':'Pausar tempo';}
function togglePause(){syncTimer();S.paused=!S.paused;syncTimer();save();}
setInterval(()=>{syncTimer();if(S.started)save();},1000);
function goto(screen){syncTimer();S.screen=screen;save();render();const h=$('.screen-title');if(h)h.focus();window.scrollTo(0,0);}
function answered(){return Object.keys(S.answers).length;}
function points(){return Object.values(S.answers).reduce((a,v)=>a+(v.correct?2:0),0);}
function steps(){return `<ol class="steps" aria-label="Missões">${DATA.missions.map((m,i)=>`<li class="${i===S.m&&S.screen!=='results'&&S.screen!=='bonus'?'current':S.notes[i]?'done':''}">${S.notes[i]?'✓ ':''}${i+1}. ${esc(m.title)}</li>`).join('')}</ol><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${TOTAL}" aria-valuenow="${answered()}" aria-label="Decisões registradas"><span style="width:${100*answered()/TOTAL}%"></span></div>`;}
function guide(){return `<details id="teacherGuide" class="guide card"><summary>Guia do professor · planejamento de 50 minutos</summary><div class="guide-body guide-grid"><section class="tight"><h3>Antes de levar à turma</h3><p>Abra este arquivo no Chromebook <b>com o Wi-Fi desligado</b>. Não é preciso instalar nada nem criar contas. A escola pode ter restrições para arquivos locais: faça o teste antes.</p><p>Distribua o HTML previamente. Prefira uma dupla ou trio por aparelho. Todos os personagens e aplicativos são fictícios.</p><table class="schedule"><thead><tr><th>Tempo</th><th>Etapa</th></tr></thead><tbody><tr><td>5 min</td><td>Apresentar o caso e combinar os papéis.</td></tr><tr><td>30 min</td><td>Quatro missões: ler, discutir, decidir e registrar a síntese. Reserve cerca de 7–8 minutos por missão.</td></tr><tr><td>10 min</td><td>Escolher duas descobertas para o caderno. Equipes que terminaram antes fazem os desafios extras.</td></tr><tr><td>5 min</td><td>Compartilhar dois exemplos e fechar: “O que uma publicação pode revelar sem a gente perceber?”</td></tr></tbody></table><p class="small muted">A duração depende do ritmo da turma. O jogo não obriga esperar nem premia velocidade. Os 50 minutos incluem conversa, registros e fechamento.</p></section><section class="tight"><h3>Condução sem correria</h3><ul><li><b>Leitor:</b> apresenta a pista e as alternativas.</li><li><b>Investigador:</b> aponta o risco e explica sua escolha.</li><li><b>Operador:</b> registra a decisão após ouvir a equipe. Troquem a cada missão. Em duplas, acumulem os papéis.</li><li>Não escrever nomes, contatos, senhas ou outros dados reais.</li><li>Uma alternativa adequada vale 2 pontos na primeira escolha. As demais recebem explicação e continuam o jogo; não há punição por pedir uma pista.</li><li>Não compare equipes pela pontuação. Observe a qualidade das justificativas e a cooperação.</li></ul><h3>Registro e segurança</h3><p>Se o navegador permitir, o progresso é guardado <b>só neste navegador/aparelho</b>. Nada é enviado pela internet. Em modo anônimo ou após limpar dados, ele pode desaparecer. O resumo pode ser baixado como TXT ao finalizar.</p><p>Em aparelhos compartilhados, baixe o resumo se necessário e use “Reiniciar” antes de outra turma. O tempo exibido é apenas uma referência.</p><p class="small muted">As explicações são princípios educativos, não um diagnóstico técnico de aplicativos ou contas reais.</p></section></div></details>`;}
function footer(){return `<footer>Atividade educativa para o 6º ano · ${TOTAL} decisões + 4 sínteses + 4 desafios extras.<br><span class="save-status">${storageOK?'Progresso guardado neste navegador, quando permitido.':'Este navegador não permitiu guardar o progresso. Mantenha a aba aberta.'} Sem conexão com serviços externos.</span></footer>`;}
function home(){return `<section class="hero"><div class="hero-copy stack"><p class="eyebrow">Um caso. Quatro missões. Uma equipe.</p><h1 class="screen-title" tabindex="-1">O caso do<br>perfil exposto</h1><p>Alex recebeu mensagens de pessoas que pareciam saber demais sobre sua vida. A missão de vocês é descobrir o que o perfil revela e ajudar a proteger suas informações.</p><div class="row"><span class="badge">6° ao 9° ano</span><span class="badge">Dupla ou trio</span><span class="badge">Sem cadastro</span></div><div class="row actions"><button class="primary" onclick="start()">Abrir a investigação →</button></div></div><aside class="story stack"><div class="identity"><div class="avatar" aria-hidden="true">A</div><div><h3>Alex</h3><p class="small muted">Personagem fictício · perfil aberto</p></div></div><p>“Como descobriram minha escola e o horário em que eu saio? Eu nunca mandei meu endereço para essas pessoas…”</p><div class="note"><b>Olhem com atenção.</b><br>Informações pequenas, quando combinadas, podem revelar muito.</div></aside></section><section class="grid4" style="margin-top:32px" aria-label="As quatro missões">${DATA.missions.map((m,i)=>`<article class="card mission-card"><div class="number">0${i+1}</div><h3>${esc(m.title)}</h3><p class="muted">${esc(m.subtitle)}</p></article>`).join('')}</section><div class="note warn" style="margin-top:24px"><b>Combinado de segurança:</b> usem só as situações fictícias. Nunca digitem suas senhas, nomes completos ou contatos reais.</div>${guide()}${footer()}`;}
function start(){S.started=true;tickAt=Date.now();S.m=0;S.q=0;goto('brief');}
function brief(){const m=DATA.missions[S.m];return `${steps()}<section class="card reflection stack"><p class="eyebrow">Missão ${S.m+1} de 4 · ${m.items.length} decisões</p><h1 class="screen-title" tabindex="-1">${esc(m.title)}</h1><p>${esc(m.intro)}</p><div class="checkpoint"><span class="number" aria-hidden="true">${S.m+1}</span><div><h3>Troca de papéis</h3><p>${esc(m.role)}</p></div></div><p class="small muted">Leiam a pista. Conversem antes de clicar. Depois da decisão, confiram a explicação e continuem.</p><button class="primary" onclick="goto('question')">Investigar a primeira pista →</button></section>${guide()}${footer()}`;}
function question(){const m=DATA.missions[S.m],it=m.items[S.q],a=S.answers[`${S.m}-${S.q}`];return `${steps()}<div class="row between"><div class="tight"><p class="eyebrow">Missão ${S.m+1} · pista ${S.q+1} de ${m.items.length}</p><h2 class="screen-title" tabindex="-1">${esc(m.title)}</h2></div><span class="badge">${answered()} / ${TOTAL} decisões</span></div><div class="gamegrid"><article class="card evidence"><div class="evidence-bar">${esc(it.type)}</div><div class="evidence-content"><div class="identity"><div class="avatar" aria-hidden="true">${S.m===1?'APP':'A'}</div><div><h3>${esc(it.title)}</h3><p class="small muted">${S.m===1?'Aplicativo fictício':'Arquivo do caso · personagem fictício'}</p></div></div><p class="quoted">${esc(it.text)}</p></div><div class="evidence-foot">Evidência ${S.m+1}.${S.q+1} · sem dados reais</div></article><section class="card tight" aria-label="Escolha da equipe"><h3>${esc(it.q)}</h3><p class="small muted">Conversem e escolham uma resposta.</p><div>${it.options.map((o,i)=>`<button class="choice ${a&&i===a.choice?'selected '+(a.correct?'correct':'wrong'):a&&i===it.correct?'correct':''}" ${a?'disabled':''} onclick="choose(${i})"><span class="letter" aria-hidden="true">${'ABC'[i]}</span><span>${esc(o)}${a&&i===it.correct?'<br><b class="small">✓ Alternativa adequada neste cenário</b>':''}${a&&i===a.choice&&!a.correct?'<br><b class="small">↻ Escolha da equipe: revisar</b>':''}</span></button>`).join('')}</div>${a?`<div class="feedback ${a.correct?'good':'review'}" role="status"><b>${a.correct?'✓ Boa decisão! +2 pontos':'Vamos revisar juntos.'}</b><p>${esc(it.explain)}</p><p class="small"><b>Conversem:</b> qual detalhe da pista foi mais importante?</p></div><div class="row actions"><button class="primary" onclick="nextQuestion()">${S.q===m.items.length-1?'Registrar a descoberta →':'Próxima pista →'}</button></div>`:`<details class="hint"><summary>Precisamos de uma pista</summary><p>${esc(it.clue)}</p></details>`}</section></div>${guide()}${footer()}`;}
function choose(i){const k=`${S.m}-${S.q}`;if(S.answers[k])return;const it=DATA.missions[S.m].items[S.q];S.answers[k]={choice:i,correct:i===it.correct};save();render();$('.feedback').scrollIntoView({block:'nearest'});}
function nextQuestion(){if(!S.answers[`${S.m}-${S.q}`])return;const m=DATA.missions[S.m];if(S.q+1<m.items.length){S.q++;goto('question');}else goto('reflection');}
function reflection(){const m=DATA.missions[S.m],n=m.items.reduce((acc,it,i)=>acc+(S.answers[`${S.m}-${i}`]?.correct?1:0),0);return `${steps()}<section class="card reflection stack"><p class="eyebrow">Pausa de investigação · missão ${S.m+1}</p><h2 class="screen-title" tabindex="-1">O que a equipe descobriu?</h2><p>Vocês analisaram ${m.items.length} situações. Em ${n}, a primeira escolha foi a mais adequada. Agora, mais importante que os pontos: expliquem o que aprenderam.</p><div class="note"><b>${esc(m.reflect)}</b></div><div><label for="note"><b>Síntese da equipe</b> <span class="small muted">· uma ou duas frases</span></label><textarea id="note" maxlength="1200" placeholder="Nossa equipe percebeu que…" oninput="updateNote(this.value)">${esc(S.notes[S.m])}</textarea><p class="small muted">Usem só exemplos fictícios. Não escrevam dados pessoais.</p><p id="noteError" class="error" role="status"></p></div><div class="row"><button class="primary" onclick="finishMission()">${S.m===3?'Fechar o caso →':'Registrar e abrir a próxima missão →'}</button></div></section>${guide()}${footer()}`;}
function updateNote(v){S.notes[S.m]=v;save();}
function finishMission(){if(S.notes[S.m].trim().length<8){$('#noteError').textContent='Escrevam uma frase curta para registrar a descoberta da equipe.';$('#note').focus();return;}if(S.m<3){S.m++;S.q=0;goto('brief');}else{syncTimer();S.paused=true;goto('results');}}
function results(){return `${steps()}<section class="tight"><p class="eyebrow">Caso encerrado</p><h1 class="screen-title" tabindex="-1">Informação também precisa de cuidado.</h1><p class="muted">Vocês ajudaram Alex a investigar o perfil, rever permissões e tomar decisões melhores.</p></section><div class="results"><aside class="card stack"><h3>Resumo da investigação</h3><p class="score">${points()} <span style="font-size:24px;letter-spacing:0">/ ${TOTAL*2}</span></p><p class="small muted">Pontos nas primeiras escolhas. Não é uma nota nem uma competição.</p><p><b>${TOTAL} situações analisadas</b><br>4 descobertas registradas<br>Tempo da equipe: ${timeText()}</p><div class="note"><b>Para o caderno:</b> escolham duas descobertas e escrevam um conselho para outro aluno.</div><button class="primary" onclick="goto('bonus')">Abrir desafios extras →</button><button onclick="downloadReport()">Baixar resumo (.txt)</button><button onclick="printReport()">Imprimir resumo</button></aside><section class="card stack"><h2>As descobertas da equipe</h2><div class="answers">${DATA.missions.map((m,i)=>`<article class="entry"><h3>${i+1}. ${esc(m.title)}</h3><p>${esc(S.notes[i])}</p></article>`).join('')}</div></section></div>${guide()}${footer()}`;}
function bonus(){return `${steps()}<section class="stack"><p class="eyebrow">Laboratório extra · sem pontuação</p><h1 class="screen-title" tabindex="-1">E se o caso fosse diferente?</h1><p>Escolham um ou mais desafios. Discutam e escrevam a resposta da equipe. Não usem dados reais.</p><div class="bonusgrid">${DATA.extras.map((e,i)=>`<article class="card extra stack"><p class="eyebrow">Desafio ${i+1}</p><h3>${esc(e.title)}</h3><p>${esc(e.text)}</p><div><label for="bonus${i}"><b>${esc(e.prompt)}</b></label><textarea id="bonus${i}" maxlength="1200" oninput="updateBonus(${i},this.value)" placeholder="Resposta da equipe…">${esc(S.bonus[i])}</textarea></div></article>`).join('')}</div><div class="row"><button class="primary" onclick="downloadReport()">Baixar resumo atualizado (.txt)</button><button onclick="goto('results')">Voltar ao resumo</button></div></section>${guide()}${footer()}`;}
function updateBonus(i,v){S.bonus[i]=v;save();}
function render(){const routes={home,brief,question,reflection,results,bonus};$('#main').innerHTML=routes[S.screen]();syncTimer();}
function openGuide(){const g=$('#teacherGuide');g.open=true;g.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});g.querySelector('summary').focus({preventScroll:true});}
function askReset(){$('#resetDialog').showModal();}
function resetGame(){$('#resetDialog').close();S=blank();tickAt=Date.now();save();render();window.scrollTo(0,0);}
function reportText(){syncTimer();let out=`DETETIVES DA PRIVACIDADE\nO caso do perfil exposto\n\nAtividade de equipe — sem dados pessoais\nDecisões registradas: ${answered()} de ${TOTAL}\nPontos nas primeiras escolhas: ${points()} de ${TOTAL*2}\nTempo de referência: ${timeText()}\n\nDESCOBERTAS\n`;
DATA.missions.forEach((m,i)=>{out+=`\n${i+1}. ${m.title}\nPergunta: ${m.reflect}\nResposta: ${S.notes[i]||'(não registrada)'}\n`;});
if(S.bonus.some(v=>v.trim())){out+='\nDESAFIOS EXTRAS\n';DATA.extras.forEach((e,i)=>{if(S.bonus[i].trim())out+=`\n${e.title}\n${S.bonus[i]}\n`;});}
out+='\nDECISÕES E EXPLICAÇÕES\n';DATA.missions.forEach((m,i)=>{m.items.forEach((it,j)=>{const a=S.answers[`${i}-${j}`];if(a)out+=`\n${i+1}.${j+1} — ${it.title}\nEscolha da equipe: ${it.options[a.choice]}\nAlternativa adequada: ${it.options[it.correct]}\nExplicação: ${it.explain}\n`;});});return out;}
function downloadReport(){const blob=new Blob(['\uFEFF'+reportText()],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='resumo-detetives-da-privacidade.txt';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function printReport(){syncTimer();$('#printReport').innerHTML=`<h1>Detetives da Privacidade</h1><p>O caso do perfil exposto · ${points()}/${TOTAL*2} pontos · ${timeText()}</p>${DATA.missions.map((m,i)=>`<section class="print-section"><h2>${i+1}. ${esc(m.title)}</h2><p>${esc(m.reflect)}</p><p><b>Síntese:</b> ${esc(S.notes[i]||'(não registrada)')}</p></section>`).join('')}${DATA.extras.map((e,i)=>S.bonus[i]?`<section class="print-section"><h2>Extra: ${esc(e.title)}</h2><p>${esc(S.bonus[i])}</p></section>`:'').join('')}`;window.print();}
render();
</script>
</body>
</html>
